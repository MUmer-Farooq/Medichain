kind = "web"
previewPath = "/"
title = "MediChain"
version = "1.0.0"
id = "artifacts/medichain"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21196

[services.development]
run = "pnpm --filter @workspace/medichain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medichain", "run", "build" ]
publicDir = "artifacts/medichain/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21196"
BASE_PATH = "/"
